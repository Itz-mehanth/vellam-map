[project]
name = "vellam-api"
version = "0.1.0"
description = "Flood depth from photos: API for Vellam Map"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's File()/Form() in argument defaults is the framework's idiom, not a bug.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette"]
